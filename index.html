fico do recall. Source\u2019 se voc\u00ea quiser ver o RTA de uma fonte enquanto ajusta o EQ de\noutro canal.\n\n30 X AIR Manual de Instru\u00e7\u00f5es\nSelecione uma faixa de ganho de 30 ou 60 dB e pr\u00e9 ou p\u00f3s resultados de EQ. 7.14 Auto Mix\nSelecione Pico para monitorar as mudan\u00e7as r\u00e1pidas na resposta de freq\u00fc\u00eancia ou\nRMS para visualizar uma resposta m\u00e9dia durante um per\u00edodo de\ntempomais longo.\nUtilidade dos buses\nA fun\u00e7\u00e3o Auto Mix \u00e9 muito \u00fatil para reuni\u00f5es ou discuss\u00f5es em painel onde\nm\u00faldplos microfones s\u00e3o usados para falar. Os canais de microfone podem\nser atribu\u00eddos a um dos dois grupos de mixagem autom\u00e1tica, o que atenuar\u00e1\nautomaticamente os canais que n\u00e3o est\u00e3o recebendo atualmente o sinal.\nClique nos bot\u00f5es de mistura autom\u00e1tica X ou Y no lado direito da janela principal\nA janela de utilit\u00e1rios Buses d\u00e1 acesso conveniente a todas as fun\u00e7\u00f5es de canal e, em seguida, clique no c\u00edrculo \u00e0 direita, logo acima de cada fader de canal que\nstrip de todos os 6 \u00f4nibus eo LR principal ao mesmo tempo. Esta janela pode ser voc\u00ea deseja atribuir \u00e0 mistura autom\u00e1tica. Um X ou Y aparecer\u00e1 no c\u00edrculo para\ndeixada aberta para que as altera\u00e7\u00f5es possam ser feitas sem ter que selecionar os indicar a atribui\u00e7\u00e3o.\nbarramentos individuais na janela principal.\nSempre que o barramento de mistura autom\u00e1tica estiver engatado, um medidor\nde redu\u00e7\u00e3o de ganho azul indicar\u00e1 a quantidade de redu\u00e7\u00e3o de sinal. Isso permite\nDCA Utility\nque o alto-falante atual seja ouvido claramente enquanto suprime qualquer ru\u00eddo\ndos outros microfones. Uma seta branca tamb\u00e9m aparece ao lado de cada fader\natribu\u00eddo ao auto mix bus, o que permite que certos canais sejam atenuados mais\nou menos para compensar vozes mais altas ou microfones mais sens\u00edveis.\nPara situa\u00e7\u00f5es em que uma pessoa est\u00e1 falando por longos per\u00edodos de tempo,\npode ser \u00fatil selecionar a caixa Last Gate abaixo do bot\u00e3o auto mix. Isso mant\u00e9m\no canal ativo mais recente aberto, evitando artefatos indesejados da abertura e\nfechamento do port\u00e3o durante as pausas na fala.\nSemelhante ao utilit\u00e1rio Buses, a janela do utilit\u00e1rio DCA permite que todos os\n4 grupos DCA sejam facilmente monitorados e ajustados.\nUm conjunto personalizado de canais, buses e / ou grupos DCA tamb\u00e9m pode ser\nconfigurado em 2 janelas definidas pelo usu\u00e1rio. Isso tem o recurso adicionado\nde expandir a faixa de canal para incluir o n\u00edvel de ganho, envios de barramento e\noutras informa\u00e7\u00f5es normalmente vis\u00edveis na guia do mixer na janela principal.\n\n31 X AIR Manual de Instru\u00e7\u00f5es\n8. MIDI\nMIDI RX/TX CH CMD N\u00e3o. Valor Comente\nAs Mudan\u00e7as de Programa 1-64 no Canal 1 podem ser\nInstant\u00e2neos 1 Prg Var 1-64 usadas para chamar os snapshots 1-64 armazenados\ndentro dos mixers X AIR.\nFader\nFaders CH 1 CC 0-15 0...127 Canais de entrada 1-16\nFaders CH 1 CC 16 0...127 Reprodu\u00e7\u00e3o AuxLineIn 17-18 / Gravador USB (est\u00e9reo)\nFaders CH 1 CC 17-20 0...127 FX1-4 Return (est\u00e9reo)\nEnviar faders 1 CC 21-26 0...127 Aux1-6 / Subgrupo\nEnviar faders 1 CC 27-30 0...127 Fx1-4\nFader principal 1 CC 31 0...127 LR principal (est\u00e9reo)\nMudo\nCH Mudos 2 CC 0-15 0/127 Canais de entrada 1-16\nCH Mudos 2 CC 16 0/127 Reprodu\u00e7\u00e3o AuxLineIn 17-18 / Gravador USB (est\u00e9reo)\nCH Mudos 2 CC 17-20 0/127 FX1-4 Return (est\u00e9reo)\nEnviar Silenciar 2 CC 21-26 0/127 Aux1-6 / Subgrupo\nEnviar Silenciar 2 CC 27-30 0...127 Fx1-4\nSilenciar Principal 2 CC 31 0/127 LR principal (est\u00e9reo)\nPanorama/Equil\u00edbrio\nCH PAN 3 CC 0-15 1...127 Canais de entrada de panorama 1-16, 64=centro\nBalance AuxLineIn 17-18 / Reprodu\u00e7\u00e3o de Gravador\nCH PAN 3 CC 16 1...127\nUSB 7\u00e3o dos efeitos dispon\u00edveis nos mixers\nX AIR. Quando as vers\u00f5es Stereo e Dual de um efeito s\u00e3o oferecidas, use a vers\u00e3o\nStereo quando os sinais esquerdo e direito devem ser alterados juntos\n(por exemplo, em canais est\u00e9reo ligados ou \u00f4nibus), ou Dual quando voc\u00ea deseja\ndiscar diferentes configura\u00e7\u00f5es para a esquerda e direita sinal.\nHall, Ambience, Rich Plate, Room, Chamber Reverb\nUm reverb de chapa foi originalmente criado atrav\u00e9s do envio de um sinal\natrav\u00e9s de um transdutor para criar vibra\u00e7\u00f5es em uma placa de chapa met\u00e1lica\nque foram ent\u00e3o capturados como um \u00c1udio. Nosso algoritmo simula esse som\ncom alta difus\u00e3o inicial e um som colorido brilhante. A placa reverbera\u00e7\u00e3o vai\ndar suas faixas o som ouvido em in\u00fameros sucessos desde o final dos anos 1950.\n(Inspirado pelo Lexicon PCM-70) PRE DELAY controla a quantidade de tempo\nantes que a reverbera\u00e7\u00e3o seja ouvida seguindo o sinal da fonte. DECAY controla\no tempo necess\u00e1rio para que o reverb se dissipe. SIZE ajusta o tamanho da sala\nEstas 5 emula\u00e7\u00f5es de reverbera\u00e7\u00e3o s\u00e3o inspiradas no Lexicon 480L. Hall simula a\nvirtual criada pelo efeito de reverbera\u00e7\u00e3o. O bot\u00e3o DAMP ajusta o decaimento das\nreverbera\u00e7\u00e3o que ocorre quando o som \u00e9 gravado em salas de concerto de m\u00e9dio\naltas freq\u00fc\u00eancias dentro da cauda do reverb. DIFF (USION) controla a densidade\na grande porte. Ambiente cria um espa\u00e7o ac\u00fastico virtual personaliz\u00e1vel para\nde reflex\u00e3o inicial. O bot\u00e3o LO CUT define a freq\u00fc\u00eancia abaixo da qual o sinal de\nadicionar calor e profundidade sem colorir o som direto.\norigem n\u00e3o passar\u00e1 pelo reverb.\nO controle deslizante PRE DELAY controla a quantidade de tempo antes que\nO bot\u00e3o HI CUT define a freq\u00fc\u00eancia acima da qual o sinal de origem n\u00e3o passar\u00e1\no reverb seja ouvido seguindo o sinal de origem. DECAY controla o tempo\npelo reverb. O bot\u00e3o BASS MULT (IPLIER) ajusta o tempo de decaimento das\nnecess\u00e1rio para que o reverb se dissipe. SIZE controla o tamanho percebido do\nfreq\u00fc\u00eancias graves. XOVER controla o ponto de crossover para graves.\nespa\u00e7o que est\u00e1 sendo criado pelo reverb. O controle deslizante DAMP ajusta a\nMOD DEPTH e SPEED controlam a intensidade ea velocidade da modula\u00e7\u00e3o da\ndecaimento das altas freq\u00fc\u00eancias dentro da cauda de reverbera\u00e7\u00e3o. DIFF (usion)\ncauda de reverbera\u00e7\u00e3o.\ncontrola a densidade de reflex\u00e3o inicial, e LEVEL controla a sa\u00edda de efeito.\nLO e HI CUT permitem que as frequ\u00eancias afetadas pelo reverb sejam reduzidas. Vintage Room\nBASSMULT (iplier) controla o ac\u00famulo de baixa freq\u00fc\u00eancia. SPREAD enfatiza o\nefeito est\u00e9reo do reverb. SHAPE ajusta o contorno do envelope de reverbera\u00e7\u00e3o.\nMOD SPEED controla a taxa de modula\u00e7\u00e3o da cauda de reverb e TAIL GAIN\najusta o volume da cauda de reverbera\u00e7\u00e3o. As reverbera\u00e7\u00f5es Rich Plate e\nRoom permitem que o delay est\u00e9reo ECHO eo delay FEEDBACK sejam ajustados\nindependentemente para cada lado. A reverbera\u00e7\u00e3o de c\u00e2mara permite que o\nest\u00e9reo REFL (ection) DELAY e GAIN sejam ajustados independentemente.\nPlate Reverb O Vintage Room simula a reverbera\u00e7\u00e3o que ocorre quando o som \u00e9 gravado em\numa pequena sala. Quando voc\u00ea quer adicionar um pouco de calor e apenas\num toque de reverbera\u00e7\u00e3o, o Vintage Room respira vida em faixas de guitarra e\ntambor perto de miced. (Inspirado pelo Qantas Quantec)\nO medidor VU exibe os n\u00edveis de entrada e sa\u00edda. Defina os tempos de reflex\u00e3o\ninicial para o canal esquerdo e direito com ER DELAY L e ER DELAY R. ER LEVEL\ndefine o volume do n\u00edvel de reflex\u00e3o inicial. REV DELAY controla a quantidade de\ salas dif\u00edceis e para produzir um som mais vivo / gravado natural. (Inspirado pelo\nfamoso Aphex Aural Exciter)\nAjuste a freq\u00fc\u00eancia do filtro de corrente lateral com o bot\u00e3o TUNE e, ainda, ajuste Modelado ap\u00f3s o Tech 21 SansAmp, o Stereo / Dual Guitar Amp simula o som de\na inclina\u00e7\u00e3o do filtro com os bot\u00f5es PEAK e ZERO FILL. Girar o bot\u00e3o TIMBRE conectar em um amplificador de guitarra real. De limpezas brilhantes a satura\u00e7\u00e3o\nesquerdo do centro acrescenta mais harm\u00f4nicos \u00edmpares, ao gir\u00e1-lo \u00e0 direita crunch, o Stereo / Dual Guitar Amp permite que um jogador de guitarra el\u00e9trica\ndo centro acrescenta mais harm\u00f4nicas pares. Ajuste o conte\u00fado harm\u00f4nico para grande som sem usar um amp\u00e8re no palco.\nadicionado ao sinal com o bot\u00e3o HARMONICS e misture o sinal efetuado com o\nO bot\u00e3o PREAMP ajusta a quantidade de ganho de entrada antes do ajuste de\nbot\u00e3o MIX. Envolva o SOLO MODE para isolar apenas o \u00e1udio resultante do efeito\ndistor\u00e7\u00e3o espec\u00edfico da banda. BUZZ ajusta a quebra de gama baixa, PUNCH ajusta\npara que voc\u00ea possa ouvir exatamente o que voc\u00ea est\u00e1 adicionando \u00e0 mistura.\na distor\u00e7\u00e3o de m\u00e9dio porte e CRUNCH adapta o conte\u00fado de alta frequ\u00eancia ea\ndistor\u00e7\u00e3o para notas suaves ou de corte. O bot\u00e3o DRIVE simula a quantidade de\ndistor\u00e7\u00e3o do amplificador de pot\u00eancia de um amplificador de tubo. Os bot\u00f5es\nLOW e HIGH permitem.\n\n42 X AIR Manual de Instru\u00e7\u00f5es\n11. V\u00eddeos de instru\u00e7\u00e3o\nEQ independente do conte\u00fado de distor\u00e7\u00e3o ea sa\u00edda geral \u00e9 controlada pelo\nbot\u00e3o LEVEL. A simula\u00e7\u00e3o CABINET pode ser ignorada se o guitarrista j\u00e1 estiver\nUma lista de reprodu\u00e7\u00e3o do Youtube com mais de 40 v\u00eddeos de tutorial pode ser\nusando uma cabine real, o que permite que o efeito funcione como um pedal de\nencontrada pesquisando \u201cX AIR How To Videos\u201d no youtube.com. Estes fornecem\nestimula\u00e7\u00e3o ou distor\u00e7\u00e3o. O Dual Guitar Amp permite que os canais esquerdo e\numa grande fonte de Informa\u00e7\u00f5es complementares a este manual e cobrem tudo,\ndireito sejam ajustados independentemente.\ndesde configura\u00e7\u00e3o b\u00e1sica, cen\u00e1rios de conex\u00e3o sem fio e configura\u00e7\u00e3o de canais\nat\u00e9 roteiros FX avan\u00e7ados e configura\u00e7\u00f5es globais.\nTube Stage\nTube Stage / Overdrive \u00e9 um efeito vers\u00e1til capaz de emular uma variedade de\npr\u00e9-amplificadores de tubo modernos e cl\u00e1ssicos. Dispon\u00edvel em vers\u00f5es est\u00e9reo\ne dual-mono, use Tube Stage / Overdrive para discar em sons quentes e fuzzy de\nsutil a totalmente saturado.\nDRIVE ajusta a quantidade de harm\u00f4nicos sendo movidos pelo efeito. EVEN e ODD\najustam a quantidade de harm\u00f4nicos pares e \u00edmpares. GAIN ajusta o ganho de\nsa\u00edda do efeito. LO CUT define a frequ\u00eancia de entrada abaixo da qual o sinal de\norigem n\u00e3o passar\u00e1 pelo efeito. HI CUT define a frequ\u00eancia de entrada acima da\nqual o sinal de entrada n\u00e3o passar\u00e1 pelo efeito. BASS GAIN / FREQ ajusta um filtro\nde prateleira baixa na sa\u00edda do efeito. TREBLE GAIN / FREQ ajusta um filtro de\nprateleira alto na sa\u00edda do efeito.\nStereo / Dual Pitch\nA mudan\u00e7a de afina\u00e7\u00e3o \u00e9 frequentemente utilizada de duas formas diferentes.\nUma delas \u00e9 ajustar o bot\u00e3o Mix para baixo e usar somente o bot\u00e3o Cent para\nfazer um pequeno conjunto off no tom entre os tons \u00famidos e secos. Isso resulta\nem um efeito de \"duplica\u00e7\u00e3o de voz\" que espessa o som geral de uma maneira\nmais sutil. O uso extremo do efeito \u00e9 girar o bot\u00e3o Mix completamente no\nsentido hor\u00e1rio para que todo o sinal seja efetuado. Desta forma, o sinal pode ser\ndeslocado para outras teclas at\u00e9 uma oitava acima ou abaixo do original.\nQuando usado em uma voz, isso resulta em um som \u201cchipmunk\u201d ou um baixo\nefeito Darth Vader.\nQuando os bot\u00f5es SEMI e CENT s\u00e3o ajustados \u00e0s 12:00, o tom n\u00e3o \u00e9 alterado.\nFazer ajustes por meio-tom ter\u00e1 um efeito muito pronunciado, Enquanto que\nas mudan\u00e7as no bot\u00e3o CENT ser\u00e3o muito pequenas. O bot\u00e3o DELAY cria uma\ndiferen\u00e7a de tempo entre o som \u00famido e seco. Os bot\u00f5es LO e HI CUT permitem\nque o sinal efetuado seja limitado em banda. O efeito Dual Pitch permite Os\ncanais esquerdo e direito a ser ajustado independentemente, e permite a\ncompensa\u00e7\u00e3o de GAIN e panning dos dois canais.\n\n43 X AIR Manual de Instru\u00e7\u00f5es\n12. Diagramas de bloco\n12.1 X18/XR18 Diagramas de bloco\nOLOS\nNIAM\nDNES\nXF\nSUB\nXUA\nR\nL\nR L\n4 32\n1\n6 5\n2 1\nPSD HCTAP\n6\u20131\nSUB\nXUA\n61\u20131 HC\nesu etanretla\nRETEM TUPNI\n61 T -1 U X O IM\nredaF\ntsoP\nREDAF\nETUM\nredaF\nerP\nD D N Q Q N A E E A B P G B 1 6 3 QE er T P RES\nS N N I I erP\nN / A P P M X O E C tupnI\nnO niaM\nna )R P L ts ( o N P AP\nredaF\ntsoP\nREDAF\nETUM\nN / A P P M X O E C QE tsoP DN Q A E B-4 QE erP TRESNI K /E C T U A D G\nW TU O C L tupnI )nrut m eR ir T BSU(\n61\n2 1 x x 4 4\n) )o R n / o L m ( ( T N U I O 4 - 4 1 - 1 X F XF\nQE\nredaF\nerP QE QE\n6\nNRUTER TRESNI 6-1 XIM\nNI-YEK\netum\n4...1 XF\nDNES TCEFFE\nredaF tsoP/redaF erP/QE erP\nNRUTER TRESNI\n61\n6\nDNES TRESNI 6-1 XIM\n)RL(\nNAP\noerets\ne en nt t u uO Om m p p u u o o r r G G\n5 6 , , 3 4 , , 1 2 x x i i M M\nDNES XUA\nleveL\nETUM\nL R n n a a P P t t s s o o P P / / r r e e d d a a F F t t s s o o P P / / r r e e d d a a F F e e r r P P / / Q Q E E t t s s o o P P / / Q Q E E e e r r P P / / e e t t a a G G t t s s o o P P / / e e t t a a G G e e r r P P / / P P H H e e r r P P\nTUO T D U N C E S W O TR L E E S R N P I\n61\nredaF tsoP\nOLOS\nOLOS\nR L n n a a P P t t s s o o P P / / r r e e d d a a   return bub;
}

function formatText(t) {
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/^(\d+\.\s)/gm, '<br>$1')
    .replace(/\n/g, '<br>');
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="avatar ai">X</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  addMsg('user', text);
  history.push({ role: 'user', content: text });
  showTyping();

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM,
        messages: history
      })
    });

    const data = await resp.json();
    removeTyping();

    if (data.error) {
      addMsg('ai', 'Erro: ' + data.error.message, true);
    } else {
      const reply = data.content[0].text;
      addMsg('ai', reply);
      history.push({ role: 'assistant', content: reply });
    }
  } catch(e) {
    removeTyping();
    addMsg('ai', 'Erro de conexão. Verifique sua internet e tente novamente.', true);
  }

  sendBtn.disabled = false;
}

function addWelcome() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="avatar ai">X</div><div class="bubble"><strong>Olá! Sou seu assistente do Behringer X AIR.</strong><br><br>Posso responder qualquer dúvida sobre o XR18 com base no manual oficial. Experimente perguntar:<div class="suggestions"><button class="suggestion-btn">Como ligar o phantom power?</button><button class="suggestion-btn">Como conectar via WiFi?</button><button class="suggestion-btn">Como usar o compressor?</button><button class="suggestion-btn">Como salvar um snapshot?</button><button class="suggestion-btn">Como rotear as saídas AUX?</button></div></div>';
  chat.appendChild(div);
  div.querySelectorAll('.suggestion-btn').forEach(btn => {
    btn.onclick = () => { input.value = btn.textContent; send(); };
  });
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
sendBtn.addEventListener('click', send);

addWelcome();
</script>
</body>
</html>
